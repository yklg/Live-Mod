name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "src/**"
      - "shared/**"
      - "package.json"
      - "vitest.config.ts"
      - "vite.config.ts"

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install
        env:
          # 单测只跑源码：跳过 Electron 二进制下载/安装（pnpm 10 默认也不执行依赖构建脚本），
          # 若测试误 import 真实 electron，应由 vi.mock 隔离而不是依赖二进制存在。
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run unit tests
        run: pnpm exec vitest run
