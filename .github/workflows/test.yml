name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "src/**"
      - "shared/**"
      - "package.json"
      - "vitest.config.ts"
      - "vite.config.ts"

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm exec vitest run
