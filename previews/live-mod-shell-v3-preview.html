<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Mod 壳层改造 v3 · 落地预览（演示数据）</title>
<style>
/* ===== 1. 主题基线（仿 Element Plus） ===== */
:root{
  --brand:#409EFF;
  --brand-dark:color-mix(in srgb, var(--brand) 80%, #000);
  --brand-light:color-mix(in srgb, var(--brand) 90%, #FFF);
  --brand-bg:color-mix(in srgb, var(--brand) 10%, #FFF);
  --success:#67C23A; --warning:#E6A23C; --danger:#F56C6C; --info:#909399;
  --text-1:#303133; --text-2:#606266; --text-3:#909399; --text-4:#C0C4CC;
  --border-1:#DCDFE6; --border-2:#E4E7ED; --border-3:#EBEEF5;
  --bg-page:#F2F3F5; --bg-card:#FFFFFF; --bg-hover:#F5F7FA;
  --radius:4px; --shadow:0 0 12px rgba(0,0,0,.10);
}
/* ===== 1.1 项目风格覆盖区（值提取自 Live Mod/src/index.css） ===== */
:root{
  --brand:#18181b;              /* from --primary: 240 5.9% 10% */
  --brand-fg:#fafafa;           /* from --primary-foreground: 0 0% 98% */
  --accent:#3b82f6;             /* from --info: 221 83% 53% */
  --success:#15803d;            /* from --success: 142 72% 29% */
  --warning:#b45309;            /* from --warning: 27 95% 37% */
  --danger:#ef4444;             /* from --destructive: 0 84.2% 60.2% */
  --text-1:#1f1f1d;             /* from --foreground: 40 5% 12% */
  --text-2:#57534e; --text-3:#8a857e; --text-4:#b8b3aa;
  --border-1:#e3ded5;           /* from --border: 40 8% 89% */
  --border-2:#ece8e0; --border-3:#f2efe9;
  --bg-page:#faf9f6;            /* from --background: 40 15% 98% */
  --bg-card:#ffffff;            /* from --card: 0 0% 100% */
  --bg-hover:#f3f0eb;           /* from --surface-2: 40 15% 97% */
  --radius:12px;                /* from --radius:.75rem / --lm-radius-card:12px */
  --radius-ctrl:8px;            /* from --lm-radius-control:8px */
  --shadow:0 4px 12px rgba(28,25,23,.06);
  --shadow-float:0 18px 48px rgba(28,25,23,.16),0 2px 8px rgba(28,25,23,.08);
  --text-body:13px;             /* from --text-body:13px */
  --motion-base:180ms;         /* from src/index.css:65 / UI_STYLE_GUIDE.md:37 */
  --ease-standard:cubic-bezier(.2,0,0,1);  /* from src/index.css:67 / UI_STYLE_GUIDE.md:38 */
}
html[data-theme="dark"]{
  --brand:#ebebeb;              /* from .dark --primary: 0 0% 92% */
  --brand-fg:#141414;           /* from .dark --primary-foreground: 0 0% 8% */
  --accent:#93c5fd;             /* from .dark --info: 214 94% 68% */
  --success:#34d399;            /* from .dark --success: 158 64% 52% */
  --warning:#fbbf24;            /* from .dark --warning: 43 96% 56% */
  --danger:#f87171;             /* from .dark --destructive: 0 72% 51% */
  --text-1:#ebebeb;             /* from .dark --foreground: 0 0% 92% */
  --text-2:#a8a8a8; --text-3:#8a8a8a; --text-4:#5f5f5f;
  --border-1:#2b2b2b;           /* from .dark --border: 0 0% 17% */
  --border-2:#242424; --border-3:#1d1d1d;
  --bg-page:#0d0d0d;            /* from .dark --background: 0 0% 5% */
  --bg-card:#141414;            /* from .dark --card: 0 0% 8% */
  --bg-hover:#1f1f1f;           /* from .dark --surface-3: 0 0% 12% */
  --shadow:0 4px 12px rgba(0,0,0,.36);
  --shadow-float:0 18px 48px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
}
/* ===== 2. 基础 ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text-1);
  font-family:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  font-size:var(--text-body);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
#demo-badge{position:fixed;right:14px;bottom:14px;z-index:90;background:var(--warning);color:#fff;
  font-size:11px;padding:4px 10px;border-radius:999px;box-shadow:var(--shadow);letter-spacing:.3px}
.topbar{height:52px;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--bg-card);
  border-bottom:1px solid var(--border-1);position:sticky;top:0;z-index:40}
.topbar .tt{font-weight:700;font-size:15px;white-space:nowrap}
.topbar .tt em{font-style:normal;color:var(--text-3);font-weight:400;margin-left:6px}
#menu{display:flex;gap:2px;flex:1;overflow-x:auto}
.menu-item{padding:6px 12px;border-radius:var(--radius-ctrl);color:var(--text-2);white-space:nowrap;cursor:pointer;font-size:12px}
.menu-item:hover{background:var(--bg-hover)}
.menu-item.cur{background:var(--brand-bg);color:var(--brand);font-weight:600}
.topbar .acts{display:flex;gap:6px;flex-shrink:0}
#crumb{padding:8px 18px;color:var(--text-3);font-size:12px}
#view{padding:0 18px 80px;max-width:1720px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:var(--radius-ctrl);
  border:1px solid var(--border-1);background:var(--bg-card);color:var(--text-2);font-size:12px;white-space:nowrap}
.btn:hover{background:var(--bg-hover);border-color:var(--text-4)}
.btn-p{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn-p:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-d{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-link{background:none;border:none;color:var(--accent);padding:2px 4px;font-size:12px}
.card{background:var(--bg-card);border:1px solid var(--border-1);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;gap:12px}
.page-head h2{margin:0;font-size:18px;font-weight:600}
.page-head .sub{color:var(--text-3);font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;line-height:18px}
.tag-ok{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.tag-warn{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.tag-info{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag-err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;color:var(--text-3);background:var(--bg-hover);padding:8px 10px;font-weight:500}
.table td{padding:8px 10px;border-top:1px solid var(--border-3)}
.input,.select,.textarea{width:100%;padding:6px 10px;border:1px solid var(--border-1);border-radius:var(--radius-ctrl);
  background:var(--bg-card);color:var(--text-1);outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.f-item{margin-bottom:12px}.f-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px}
.f-err{display:none;color:var(--danger);font-size:11px;margin-top:3px}
.f-item.invalid .f-err{display:block}.f-item.invalid .input{border-color:var(--danger)}
/* ===== 3. 改动点徽章 ===== */
.has-change{position:relative;outline:1px dashed var(--warning);outline-offset:2px}
.change-badge{position:absolute;right:-8px;top:-9px;z-index:12;width:19px;height:19px;border-radius:50%;
  background:var(--warning);color:#fff;font-size:10px;line-height:19px;text-align:center;box-shadow:var(--shadow)}
/* ===== 4. 模拟 Electron 壳窗口 ===== */
.appwin{background:var(--bg-card);border:1px solid var(--border-1);border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;height:460px;min-width:0}
.appbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--bg-hover);border-bottom:1px solid var(--border-1)}
.traffic{display:flex;gap:5px;margin-right:6px}
.traffic i{width:9px;height:9px;border-radius:50%;background:var(--border-1);display:block}
.traffic i:first-child{background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.appbar .logo{width:22px;height:22px;border-radius:6px;background:var(--brand);color:var(--brand-fg);
  display:grid;place-items:center;font-size:12px;font-weight:700}
.appbar b{font-size:12px}.appbar .sep{color:var(--text-4)}.appbar .mtxt{color:var(--text-3);font-size:11px}
.appbar .sp{flex:1}
.iconbtn{width:26px;height:26px;border:none;background:transparent;color:var(--text-2);border-radius:6px;
  display:grid;place-items:center;font-size:11px}
.iconbtn:hover{background:var(--bg-card)}
.launch-btn{height:27px;padding:0 10px;border:none;border-radius:7px;background:var(--brand);color:var(--brand-fg);
  font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.launch-btn:hover{background:var(--brand-dark)}
.browserbar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:5px;padding:0 9px;
  border-bottom:1px solid var(--border-1);background:color-mix(in srgb,var(--bg-card) 70%,var(--bg-hover))}
.navbtn{width:22px;height:22px;border:none;background:transparent;color:var(--text-2);font-size:13px;border-radius:5px}
.navbtn:hover{background:var(--bg-hover)}
.addr{flex:1;height:24px;border-radius:999px;border:1px solid var(--border-1);background:var(--bg-hover);
  color:var(--text-3);font-size:10px;display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap}
.workspace{flex:1;display:flex;position:relative;min-height:0;overflow:hidden}
.pageview{flex:1;min-width:0;background:var(--bg-card);display:flex;flex-direction:column;overflow:hidden}
.pv-head{height:30px;flex-shrink:0;border-bottom:1px solid var(--border-2);display:flex;align-items:center;
  padding:0 10px;gap:8px;font-size:10px;color:var(--text-3)}
.pv-body{flex:1;display:flex;min-height:0}
.pv-left{width:150px;flex-shrink:0;border-right:1px solid var(--border-2);padding:8px;overflow:hidden}
.pv-mid{flex:1;min-width:0;padding:8px;display:flex;flex-direction:column;gap:7px}
.pv-screen{flex:1;border-radius:8px;background:linear-gradient(0deg,var(--bg-hover),var(--bg-card));
  border:1px solid var(--border-2);display:grid;place-items:center;color:var(--text-4);font-size:11px}
.pv-right{width:150px;flex-shrink:0;border-left:1px solid var(--border-2);padding:8px;overflow:hidden}
.pv-right h5{margin:0 0 6px;font-size:10px;color:var(--text-2)}
.goods{height:26px;border-radius:5px;background:var(--bg-hover);margin-bottom:5px;font-size:9px;
  color:var(--text-3);display:flex;align-items:center;padding:0 6px}
.cmt{font-size:9px;color:var(--text-2);padding:4px 0;border-bottom:1px dashed var(--border-2);line-height:1.4}
.cmt b{color:var(--text-1)}
.railstrip{width:56px;flex-shrink:0;background:var(--bg-hover);border-left:1px solid var(--border-1);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0}
.ritem{width:40px;height:38px;border:none;background:transparent;border-radius:9px;color:var(--text-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:8px}
.ritem i{width:14px;height:14px;border-radius:4px;background:var(--border-1);display:block;font-style:normal;
  font-size:8px;line-height:14px;text-align:center;color:var(--text-2)}
.ritem:hover{background:var(--bg-card)}
.ritem.cur{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.ritem.cur i{background:var(--accent);color:#fff}
.dockpanel{width:300px;flex-shrink:0;border-left:1px solid var(--border-1);background:var(--bg-card);
  display:flex;flex-direction:column;min-width:0}
.panel-head{height:34px;flex-shrink:0;border-bottom:1px solid var(--border-1);display:flex;align-items:center;
  gap:6px;padding:0 9px;font-size:11px;font-weight:600}
.panel-head .sp{flex:1}
.panel-head .hint{font-size:9px;color:var(--text-4);font-weight:400}
.panel-body{flex:1;padding:10px;overflow:auto}
.floatpanel{position:absolute;right:0;top:0;bottom:0;width:300px;background:var(--bg-card);
  border-left:1px solid var(--border-1);box-shadow:var(--shadow-float);display:flex;flex-direction:column;z-index:8}
.railmenu{position:absolute;right:10px;top:8px;width:232px;background:var(--bg-card);
  border:1px solid var(--border-1);border-radius:var(--radius);box-shadow:var(--shadow-float);
  z-index:10;padding:6px;max-height:300px;overflow:auto}
/* ===== 内容框进出动效：180ms 标准档，R9 fill-mode 分档裁决 ===== */
#anim-layer{position:fixed;inset:0;z-index:100;pointer-events:none}
#anim-layer > .is-closing{
  position:fixed !important;right:auto !important;bottom:auto !important;
  margin:0 !important;pointer-events:none;
  animation:lm-out var(--motion-base) var(--ease-standard) both
}
@keyframes lm-in{
  from{opacity:0;transform:translate(var(--lm-dx,0px),var(--lm-dy,0px))}
  to{opacity:1;transform:translate(0,0)}
}
@keyframes lm-out{
  from{opacity:1;transform:translate(0,0)}
  to{opacity:0;transform:translate(var(--lm-dx,0px),var(--lm-dy,0px))}
}
.railmenu{--lm-dx:0px;--lm-dy:-8px}
.floatpanel,.dockpanel{--lm-dx:8px;--lm-dy:0px}
.dockpanel.is-entering,.floatpanel.is-entering,.railmenu.is-entering{
  animation:lm-in var(--motion-base) var(--ease-standard) backwards
}
@media (prefers-reduced-motion: reduce){
  .dockpanel,.floatpanel,.railmenu,
  .dockpanel.is-entering,.floatpanel.is-entering,.railmenu.is-entering,
  #anim-layer > .is-closing{animation:none !important;transition:none !important}
}
[data-static]{animation:none !important}
.railmenu h6{margin:3px 8px 7px;font-size:10px;color:var(--text-3);font-weight:500}
.menuitem{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border:none;background:transparent;
  border-radius:var(--radius-ctrl);color:var(--text-1);font-size:12px;text-align:left}
.menuitem:hover{background:var(--bg-hover)}
.menuitem.cur{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.menuitem i{width:22px;height:22px;border-radius:6px;background:var(--bg-hover);display:grid;place-items:center;
  font-style:normal;font-size:10px;color:var(--text-2);flex-shrink:0}
.menuitem small{display:block;color:var(--text-4);font-size:10px;line-height:1.2}
.overlay-tip{position:absolute;right:8px;top:8px;z-index:7;background:var(--warning);color:#fff;
  font-size:9px;padding:3px 7px;border-radius:6px;box-shadow:var(--shadow)}
.window-cap{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;color:var(--text-2);font-weight:600}
.window-cap .dot{width:8px;height:8px;border-radius:50%;background:var(--border-1)}
.window-cap.after .dot{background:var(--accent)}
.compare-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare-wrap>section{min-width:0}
.compare-wrap h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--text-2)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;font-size:11px;color:var(--text-3)}
.legend span{background:var(--bg-card);border:1px solid var(--border-1);border-radius:6px;padding:3px 8px}
/* ===== 5. 状态 / toast / 控制台 / 抽屉 / 引导 / 弹窗 ===== */
.skel{height:11px;border-radius:5px;background:var(--border-3);margin-bottom:7px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.emptybox{text-align:center;padding:22px 10px;color:var(--text-3);font-size:12px}
.emptybox .ico{width:42px;height:42px;margin:0 auto 8px;border-radius:12px;background:var(--bg-hover);
  display:grid;place-items:center;color:var(--text-4);font-size:18px}
.failbox{text-align:center;padding:18px 10px;color:var(--danger);font-size:12px}
#toast-root{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--bg-card);border:1px solid var(--border-1);border-left:4px solid var(--info);
  border-radius:var(--radius-ctrl);box-shadow:var(--shadow);padding:8px 14px;font-size:12px;min-width:200px;max-width:460px;
  animation:tin .18s ease-out}
.toast.success{border-left-color:var(--success)}.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}.toast.info{border-left-color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#console-fab{position:fixed;right:16px;bottom:46px;z-index:80;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--border-1);background:var(--bg-card);color:var(--text-2);box-shadow:var(--shadow);font-size:15px}
#console-panel{position:fixed;right:16px;bottom:92px;z-index:85;width:300px;max-height:70vh;overflow:auto;
  background:var(--bg-card);border:1px solid var(--border-1);border-radius:var(--radius);box-shadow:var(--shadow-float);
  padding:14px;display:none}
#console-panel.open{display:block}
#console-panel h4{margin:10px 0 6px;font-size:11px;color:var(--text-3);font-weight:600}
#console-panel h4:first-child{margin-top:0}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap}
.seg button{border:1px solid var(--border-1);background:var(--bg-card);color:var(--text-2);
  font-size:10px;padding:3px 7px;border-radius:5px}
.seg button.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.region-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 0;
  border-bottom:1px solid var(--border-3);font-size:11px}
#flow-drawer{position:fixed;right:0;top:0;bottom:0;width:310px;background:var(--bg-card);
  border-left:1px solid var(--border-1);box-shadow:var(--shadow-float);z-index:95;padding:18px;
  transform:translateX(100%);transition:transform .2s;overflow:auto}
#flow-drawer.open{transform:none}
.flow-step{display:flex;align-items:center;gap:6px;justify-content:center;min-height:24px}
.flow-line{width:1px;height:14px;background:var(--border-1)}
.flow-edge{font-size:10px;color:var(--text-4)}
.flow-node{display:inline-block;border:1px solid var(--border-1);border-radius:999px;padding:5px 12px;
  font-size:11px;color:var(--text-2);background:var(--bg-card);cursor:pointer}
.flow-node.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
#tour-root{display:none;position:fixed;inset:0;z-index:110;pointer-events:none}
.tour-spot{position:absolute;border:2px solid var(--accent);border-radius:10px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.tour-tip{position:absolute;width:290px;background:var(--bg-card);border:1px solid var(--border-1);
  border-radius:var(--radius);box-shadow:var(--shadow-float);padding:12px;pointer-events:auto}
.tour-tip p{margin:0 0 10px;font-size:12px}
.tour-tip .row{display:flex;align-items:center;justify-content:space-between}
.tour-tip .n{font-size:11px;color:var(--text-4)}
#modal-root{position:fixed;inset:0;z-index:115;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px}
#modal-root.open{display:flex}
.modal{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-float);width:min(680px,100%);max-height:82vh;overflow:auto}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--border-1);font-size:15px;font-weight:600}
.modal-b{padding:16px 18px}.modal-f{padding:12px 18px;border-top:1px solid var(--border-1);text-align:right}
.notice{background:var(--bg-hover);border-left:3px solid var(--accent);padding:9px 12px;border-radius:6px;font-size:12px;color:var(--text-2);margin:10px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:12px;margin:8px 0}
.kv b{color:var(--text-3);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.compare-wrap{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="demo-badge">演示数据 · 非真实系统</div>
<header class="topbar">
  <div class="tt">Live Mod 壳层改造 <em>v3 落地预览</em></div>
  <nav id="menu"></nav>

const MOTION={

function withCloseAnimation(o){
  const kinds=o.kinds||[],scope=o.scope||$('#view');
  if(MOTION.reduced())document.documentElement.setAttribute('data-motion-fallback','reduce');
  const sel=kinds.map(k=>'.'+k+':not([data-anim-ghost]):not([data-static])').join(',');
  const list=(!MOTION.reduced()&&kinds.length&&sel)
    ? $$(sel,scope).filter(n=>!n.closest('#anim-layer')) : [];
  const batch=++MOTION.seq,layer=animLayer();
  if(list.length){
    list.forEach(n=>{
      const r=n.getBoundingClientRect();
      n.classList.remove('is-entering');n.classList.add('is-closing');
      n.setAttribute('data-anim-ghost','');n.setAttribute('data-anim-batch',String(batch));
      n.setAttribute('aria-hidden','true');
      n.style.left=r.left+'px';n.style.top=r.top+'px';
      n.style.width=r.width+'px';n.style.height=r.height+'px';
      n.style.pointerEvents='none';
      layer.appendChild(n);
    });
  }
  if(o.apply)o.apply();
  o.render();
  if(list.length){MOTION.ghostTimers++;setTimeout(()=>{
    $$('[data-anim-batch="'+batch+'"]',layer).forEach(n=>n.remove());
    const leftover=$$('.is-closing',layer);
    if(leftover.length>1)console.warn('[motion] 残影堆积：'+leftover.length+' 个（batch '+batch+'）');
  },MOTION.base)}
  return list.length;
}

    '<h4>改动点速览</h4>'+CHANGES.map(c=>'<div class="region-row"><span>'+c.id+' '+esc(c.plan.slice(0,14))+'…</span><button class="btn-link" data-go-c="'+c.page+'">前往</button></div>').join('')+
    '<div style="margin-top:10px;text-align:right"><button class="btn btn-sm" id="con-reset">重置全部</button></div>';
  $$('[data-net]',p).forEach(b=>b.onclick=()=>{NET.mode=b.dataset.net;toast('网络模式：'+b.textContent,'info');route();renderConsole()});
  $$('[data-rg]',p).forEach(b=>b.onclick=()=>{const k=b.dataset.rg,v=b.dataset.v;if(v)REGION_STATE[k]=v;else delete REGION_STATE[k];route();renderConsole()});
  $$('[data-go-c]',p).forEach(b=>b.onclick=()=>nav(b.dataset.goC));
  $('#con-reset',p).onclick=()=>{NET.mode='normal';Object.keys(REGION_STATE).forEach(k=>delete REGION_STATE[k]);route();renderConsole();toast('已重置','info')}}
function mountChanges(root){$$('[data-change]',root).forEach(el=>{if(el.querySelector(':scope>.change-badge'))return;
  el.classList.add('has-change');const c=CHANGES.find(x=>x.id===el.dataset.change);
  const b=document.createElement('span');b.className='change-badge';b.textContent=el.dataset.change;
  b.title=c?('改动点 '+c.id+'：'+c.plan):'改动点 '+el.dataset.change;el.appendChild(b)})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){
  if($('#modal-root').classList.contains('open'))return closeModal();
  if(tour.active)return stopTour();
  const states=[UI.after,UI.panel];
  const withMenu=states.find(s=>s.menuOpen);
  if(withMenu){withCloseAnimation({scope:$('#view'),kinds:['railmenu'],apply:()=>closeMenu(withMenu),render:route});toast('ESC 关闭菜单（单次 toggle）','info');return}
  const withPanel=states.find(s=>s.panelOpen);
  if(withPanel){withCloseAnimation({scope:$('#view'),kinds:['floatpanel'],apply:()=>closePanel(withPanel),render:route});return}
}});
try{
  route();
  const boot=document.getElementById('boot-fallback');if(boot)boot.remove();
}catch(e){
  const f=document.getElementById('boot-fallback');
  if(f){f.textContent='预览初始化失败：'+String((e&&e.message)||e)+'。请直接双击本地 HTML 文件用浏览器打开。';f.style.color='var(--danger)'}
}
</script>
</body>
</html>
